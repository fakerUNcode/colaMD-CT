name: Release CT (macOS dmg + pkg)

# ColaMD CT 的 macOS 安装包只能产出在真 macOS 上：
#   - dmg 用的 dmgbuild 工具链绑定 PyObjC 的 darwin 二进制
#   - pkg 用的 pkgbuild/productbuild 是 macOS 专属
# 本工作流在 GitHub 免费的 macos runner 上构建（未签名，如需签名把证书写进
# Secrets 并按 electron-builder 文档配置 CSC_NAME / notarize）。
#
# 触发：手动（Actions → Run workflow），或推 v* 标签。
# 产物：Artifacts 里的 dmg / pkg / zip（arm64 + x64 各一份）。
#
# 用法（本仓库推到你的 GitHub 后）：
#   git remote add origin git@github.com:<你>/colamd-ct.git
#   git push -u origin main
#   然后到 Actions 页手动 Run workflow，或：git tag v2.7.15 && git push --tags

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build renderer/main
        run: npx electron-vite build

      - name: Package dmg / pkg / zip (unsigned)
        run: npx electron-builder --mac dmg pkg zip --arm64 --x64 --publish never
        env:
          # 无签名证书时跳过签名/公证，产出未签名包（首次打开需右键 → 打开）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: colamd-ct-macos-dmg-pkg
          path: |
            release/*.dmg
            release/*.pkg
            release/*.zip
          if-no-files-found: error
