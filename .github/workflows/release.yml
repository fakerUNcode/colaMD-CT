name: Release

# ColaMD CT 的统一发布工作流：推 v* 标签时三平台构建并发布 GitHub Release。
#
#   - macOS：dmg / pkg / zip，x64 与 arm64 串行构建（pkg 多架构并行会争抢同一个
#     中间文件 ai.marswave.colamdct.pkg，electron-builder 已知竞态，实测 ENOENT
#     unlink，串行规避）
#   - Windows：NSIS 安装器 + 便携 zip
#   - Linux：AppImage + deb
#
# 全部未签名（CT 无证书）：mac 首次打开需右键 → 打开，Windows 会过 SmartScreen
# 提示。需要签名/公证时把证书配进 Secrets 并按 electron-builder 文档设置。
#
# Release 正文取 resources/demo/changelog.md 里对应版本的段落（用户在应用内读
# 到的就是这一段，发布页保持一致）。手动触发（Actions → Run workflow）只构建
# 不发版，产物在 Artifacts 里核对。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - run: npm run build

      # dmg / pkg 只能在真 macOS 上构建（二进制层面的硬限制，见 README_CT.md）。
      # x64 与 arm64 串行两步，规避 pkg 的多架构竞态。
      - name: Build distributables (macOS, unsigned)
        if: matrix.platform == 'mac'
        run: |
          npx electron-builder --mac dmg pkg zip --x64 --publish never
          npx electron-builder --mac dmg pkg zip --arm64 --publish never
        env:
          # 无签名证书时跳过签名/公证，产出未签名包
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build distributables (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish never

      - name: Build distributables (Linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.pkg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  # 标签推送时发布 Release；手动触发只构建，产物可先在 Artifacts 里核对。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The version's section in resources/demo/changelog.md is what users
      # read in the app, so it is also what they read on the release page.
      # GitHub's generated notes only ever listed merge commits.
      - name: Take the release notes from the changelog
        id: notes
        run: |
          set -euo pipefail
          awk -v v="${GITHUB_REF_NAME#v}" '
            BEGIN { target = "## v" v }
            index($0, target) == 1 { found = 1; print; next }
            found && /^## / { exit }
            found { print }
          ' resources/demo/changelog.md > "$RUNNER_TEMP/notes.md"
          # The section below ours is the previous release, so the changelog
          # alone gives the compare range: no need to fetch the tags. Only
          # link the compare when that tag actually exists in this repo
          # (a fork's first release inherits changelog sections from upstream
          # that have no tag here; a dead compare link would be noise).
          PREVIOUS=$(awk -v v="${GITHUB_REF_NAME#v}" '
            BEGIN { target = "## v" v }
            index($0, target) == 1 { found = 1; next }
            found && /^## v/ { print substr($2, 2); exit }
          ' resources/demo/changelog.md)
          if [ -s "$RUNNER_TEMP/notes.md" ] && [ -n "$PREVIOUS" ] \
             && git ls-remote --exit-code --tags origin "refs/tags/v$PREVIOUS" >/dev/null 2>&1; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/v%s...%s\n' \
              "$GITHUB_REPOSITORY" "$PREVIOUS" "$GITHUB_REF_NAME" >> "$RUNNER_TEMP/notes.md"
          fi
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Release notes::resources/demo/changelog.md has no section for ${GITHUB_REF_NAME}; publishing with generated notes"
          fi

      - name: Publish with the changelog section
        if: steps.notes.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: ${{ runner.temp }}/notes.md
          prerelease: ${{ vars.COLAMD_PRERELEASE == 'true' }}

      # A missing section still publishes, so a typo in the version number
      # cannot leave a tagged release unpublished. The warning above is the
      # signal to add the missing section.
      - name: Publish with generated notes
        if: steps.notes.outputs.found != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ vars.COLAMD_PRERELEASE == 'true' }}
